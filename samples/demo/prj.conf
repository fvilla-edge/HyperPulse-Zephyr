# Common configuration file across targets

# Enable Module
CONFIG_HYPERPULSE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=10240
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_NCS_BOOT_BANNER=n

CONFIG_LED=y
CONFIG_LED_GPIO=y

# Shell support
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="myriota:~$ "
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HELP_OPT_PARSE=y
CONFIG_SHELL_AUTOSTART=n
CONFIG_SHELL_STACK_SIZE=4096

# Settings support
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_SHELL=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/edge/settings"

CONFIG_PM_DEVICE=y

# Disable file system logging
CONFIG_FS_LOG_LEVEL_OFF=y

# FS is stack heavy
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_STATIC_INIT_GNU=y

# Enable system reset on fatal error
CONFIG_RESET_ON_FATAL_ERROR=y
