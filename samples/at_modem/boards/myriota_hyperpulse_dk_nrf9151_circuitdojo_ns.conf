# Pmic LED driver
CONFIG_LED_NPM1300=y
CONFIG_LED_GPIO=n

# GPS Antenna configuration
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0=1,1,1565,1586"

# Add the accelerometer
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y
CONFIG_LIS2DH_ODR_RUNTIME=y

# Regulator control
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM1300=y
