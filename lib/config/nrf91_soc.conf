# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=8192
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=8192
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y

# Modem Trace
CONFIG_NRF_MODEM_LIB_TRACE=n
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_RTT=n

# Custom AT commands
CONFIG_AT_CMD_CUSTOM=y
CONFIG_AT_CMD_CUSTOM_LOG_LEVEL_OFF=y

# AT Modem Cmd/Response Parser support
CONFIG_AT_PARSER=y

# Modem key management
CONFIG_MODEM_KEY_MGMT=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV6=n    # Disable Native IPv6 because we don't need it

# Misc
CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_ZMS_LOG_LEVEL_ERR=y
